<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>ars JOCALIS 個人オーダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f7f7f7;--border:#dedede;
  --text:#111111;--muted:#999999;--accent:#111111;--brand:#111111;
  --red:#b5281e;--radius:0px;--shadow:0 1px 8px rgba(0,0,0,.07);
  --tag-27:#111;--tag-27t:#fff;--tag-26:#555;--tag-26t:#fff;--tag-25:#999;--tag-25t:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;padding-bottom:100px;letter-spacing:.01em}
h1,h2,.serif{font-family:"Cormorant Garamond",serif}

/* Header */
.app-header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 28px;height:64px;gap:16px}
.logo{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:300;letter-spacing:.18em;color:#111;flex:1;text-transform:uppercase}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;line-height:2;font-weight:400}
.cart-btn{position:relative;background:none;border:1px solid #111;cursor:pointer;padding:9px 20px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#111;font-family:"DM Sans",sans-serif;
  display:flex;align-items:center;gap:8px;transition:.2s}
.cart-btn:hover{background:#111;color:#fff}
.cart-btn:hover .cart-count{background:#fff;color:#111}
.cart-count{background:#111;color:#fff;width:18px;height:18px;
  font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.2s}

/* Event banner */
.event-banner{background:#111;color:#fff;text-align:center;padding:10px 20px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:400}

/* Sections */
.section{max-width:700px;margin:0 auto;padding:28px 24px 0}
.products-section{max-width:1440px;padding:28px 24px 0}
@media(min-width:900px){.products-section{padding-left:40px;padding-right:40px}}
@media(min-width:1200px){.product-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.section-title{font-family:"Cormorant Garamond",serif;font-size:11px;font-weight:400;
  letter-spacing:.22em;color:var(--muted);text-transform:uppercase;
  margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}

/* Form */
.card{background:var(--surface);border:1px solid var(--border);padding:20px;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-grid{grid-template-columns:1fr}}
.form-row{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.form-input,.form-textarea{width:100%;padding:10px 12px;border:1px solid var(--border);
  background:#fff;color:var(--text);font-size:13px;font-family:"DM Sans",sans-serif;
  outline:none;transition:.2s;border-radius:0}
.form-input:focus,.form-textarea:focus{border-color:#111;outline:none}
.form-textarea{resize:vertical;min-height:64px}
.form-full{grid-column:1/-1}
.delivery-note{background:#f7f7f7;border:1px solid var(--border);padding:12px 14px}
.delivery-note .form-label{margin-bottom:5px}
.delivery-note-main{font-size:13px;font-weight:500;letter-spacing:.02em}
.delivery-note-sub{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em}

/* Filters */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding:4px 2px;white-space:nowrap}
.filter-btn{font-size:10px;padding:8px 14px;min-height:36px;border:1px solid var(--border);
  background:#fff;cursor:pointer;color:var(--muted);font-family:"DM Sans",sans-serif;
  transition:.15s;white-space:nowrap;letter-spacing:.1em;text-transform:uppercase;
  -webkit-appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.filter-btn:hover{color:#111;background:#f7f7f7;border-color:#bbb}
.filter-btn.active{background:#111;color:#fff;border-color:#111}
.filter-sep{width:1px;height:28px;background:var(--border);margin:0 4px;align-self:center}
@media(max-width:600px){
  .filter-bar{gap:5px}
  .filter-btn{padding:9px 12px;min-height:40px;font-size:11px}
  .filter-sep{display:block}
}

/* Product image */
.prod-img{width:100%;margin-bottom:12px;background:#f0ede8;
  display:flex;align-items:center;justify-content:center;overflow:hidden;aspect-ratio:1/1;position:relative}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s ease-out}
.product-card:hover .prod-img img{transform:scale(1.03)}
.prod-img-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;
  background:linear-gradient(135deg,#ede9e2 0%,#e4ddd4 100%);gap:8px}
.prod-img-ph-letter{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:300;color:#8a7f72;letter-spacing:.08em;line-height:1}
.prod-img-ph-type{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#b0a898;font-weight:400}

/* Product grid */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;margin-bottom:24px;background:var(--border)}
.product-card{background:#fff;border:none;
  padding:18px;cursor:pointer;transition:.2s;position:relative}
.product-card:hover{background:#fafafa}
.product-card.out-of-stock{opacity:.45;cursor:default}
.prod-name{font-size:13px;font-weight:400;margin-bottom:4px;line-height:1.5;letter-spacing:.02em}
.prod-meta{font-size:10px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;letter-spacing:.04em}
.tag{display:inline-block;padding:2px 6px;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.t27{background:var(--tag-27);color:var(--tag-27t)}
.t26{background:var(--tag-26);color:var(--tag-26t)}
.t25{background:var(--tag-25);color:var(--tag-25t)}
.prod-price{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.price-main{font-size:16px;font-weight:500;color:var(--red);font-family:"Cormorant Garamond",serif;letter-spacing:.02em}
.price-retail{font-size:10px;color:var(--muted);letter-spacing:.04em}
.price-badge{font-size:9px;background:#fef0ee;color:var(--red);padding:2px 6px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.size-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.size-btn{font-size:10px;padding:7px 11px;min-height:34px;border:1px solid var(--border);
  background:#fff;cursor:pointer;color:var(--text);font-family:"DM Sans",sans-serif;transition:.15s;white-space:nowrap;letter-spacing:.04em;
  -webkit-appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.size-btn:hover,.size-btn.selected{background:#111;color:#fff;border-color:#111}
.add-btn{width:100%;padding:12px;min-height:42px;border:1px solid #111;background:#111;
  color:#fff;font-size:10px;cursor:pointer;font-family:"DM Sans",sans-serif;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;transition:.2s;
  -webkit-appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.add-btn:hover{background:#fff;color:#111}
.add-btn:disabled{background:#fff;border-color:var(--border);color:var(--muted);cursor:default}

/* Cart drawer */
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200}
.cart-overlay.open{display:block}
.cart-drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100vw);background:#fff;
  z-index:201;transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;border-left:1px solid var(--border)}
.cart-drawer.open{transform:none}
.cart-header{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--border);gap:12px}
.cart-title{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:300;letter-spacing:.12em;text-transform:uppercase;flex:1}
.cart-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;padding:4px;transition:.15s}
.cart-close:hover{color:#111}
.cart-body{flex:1;overflow-y:auto;padding:16px 24px}
.cart-empty{text-align:center;color:var(--muted);padding:48px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.cart-line{display:grid;grid-template-columns:1fr 60px 24px;gap:8px;align-items:start;
  padding:12px 0;border-bottom:1px solid var(--border)}
.cl-name{font-size:12px;font-weight:500;line-height:1.5;margin-bottom:2px;letter-spacing:.02em}
.cl-meta{font-size:10px;color:var(--muted);letter-spacing:.04em}
.cl-price{font-size:13px;font-weight:500;color:var(--red);text-align:right;font-family:"Cormorant Garamond",serif}
.cl-sub{font-size:10px;color:var(--muted);text-align:right}
.cl-del{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0 2px;line-height:1;align-self:center;transition:.15s}
.cl-del:hover{color:#111}
.cart-footer{padding:16px 24px;border-top:1px solid var(--border)}

/* Shipping toggle in cart */
.ship-toggle{display:flex;gap:0;margin:10px 0;border:1px solid var(--border)}
.ship-opt{flex:1;padding:10px 4px;min-height:44px;border:none;border-right:1px solid var(--border);
  background:#fff;cursor:pointer;font-size:10px;font-family:"DM Sans",sans-serif;color:var(--muted);
  text-align:center;transition:.15s;line-height:1.4;letter-spacing:.06em;
  -webkit-appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ship-opt:last-child{border-right:none}
.ship-opt.active-pickup{background:#111;color:#fff}
.ship-opt.active-delivery{background:#111;color:#fff}
.ship-opt.active-cod{background:#111;color:#fff}
.total-rows{margin:10px 0 14px}
.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;letter-spacing:.02em}
.total-main{font-size:15px;font-weight:500;padding-top:10px;border-top:1px solid #111;margin-top:6px;letter-spacing:.02em}
.print-btn{width:100%;padding:13px;border:1px solid #111;background:#111;
  color:#fff;font-size:10px;cursor:pointer;font-family:"DM Sans",sans-serif;font-weight:400;
  letter-spacing:.16em;text-transform:uppercase;transition:.2s;margin-top:6px}
.print-btn:hover{background:#fff;color:#111}
.print-btn:disabled{background:#fff;border-color:var(--border);color:var(--muted);cursor:default}

/* Print overlay */
.print-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:#fff;z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch}
.print-overlay.open{display:block}
.print-overlay-inner{max-width:860px;margin:0 auto;padding:32px 24px 60px}
.print-overlay-actions{position:sticky;top:0;background:#fff;border-bottom:1px solid #e0e0e0;
  display:flex;gap:8px;padding:12px 16px;z-index:10;align-items:center}
.po-close{background:none;border:1px solid var(--border);padding:8px 16px;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:"DM Sans",sans-serif;
  color:var(--muted);touch-action:manipulation}
.po-print{background:#111;border:none;padding:8px 20px;font-size:10px;color:#fff;
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;font-family:"DM Sans",sans-serif;
  touch-action:manipulation}
.po-hint{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-left:auto}
@media print{
  .print-overlay-actions{display:none}
  body > *:not(.print-overlay){display:none!important}
  .print-overlay{display:block!important;position:static;overflow:visible}
  .print-overlay-inner{padding:0}
}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);
  background:#111;color:#fff;padding:11px 24px;font-size:11px;letter-spacing:.1em;
  opacity:0;transition:.25s;z-index:500;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Qty control */
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{background:#fff;border:1px solid var(--border);width:22px;height:22px;
  cursor:pointer;font-size:14px;color:var(--text);display:flex;align-items:center;justify-content:center;line-height:1;transition:.15s;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.qty-btn:hover{background:#111;color:#fff;border-color:#111}
.qty-num{font-size:12px;min-width:20px;text-align:center;font-weight:500}

/* Payment status */
.paid-btn{width:100%;padding:13px;border:2px solid #1a6e3c;background:#f0faf4;
  color:#1a6e3c;font-size:10px;cursor:pointer;font-family:"DM Sans",sans-serif;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;transition:.2s;margin-top:6px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.paid-btn:hover{background:#1a6e3c;color:#fff}
.paid-confirmed{width:100%;padding:13px;border:2px solid #1a6e3c;background:#1a6e3c;
  color:#fff;font-size:10px;font-family:"DM Sans",sans-serif;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;margin-top:6px;text-align:center}

/* Order management overlay */
.orders-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300}
.orders-overlay.open{display:block}
.orders-panel{position:fixed;inset:0;background:#fff;z-index:301;display:flex;flex-direction:column;overflow:hidden}
.orders-header{display:flex;align-items:center;padding:0 28px;height:56px;border-bottom:1px solid var(--border);gap:16px;flex-shrink:0}
.orders-title{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;flex:1}
.orders-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;padding:4px;touch-action:manipulation}
.orders-close:hover{color:#111}
.orders-toolbar{display:flex;align-items:center;gap:8px;padding:12px 28px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.orders-count{font-size:11px;color:var(--muted);letter-spacing:.06em;flex:1}
.orders-action-btn{padding:8px 16px;border:1px solid var(--border);background:#fff;
  color:var(--text);font-size:10px;cursor:pointer;font-family:"DM Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;transition:.15s;touch-action:manipulation}
.orders-action-btn:hover{background:#111;color:#fff;border-color:#111}
.orders-action-btn.danger{border-color:var(--red);color:var(--red)}
.orders-action-btn.danger:hover{background:var(--red);color:#fff}
.orders-body{flex:1;overflow-y:auto;padding:20px 28px}
.order-card{border:1px solid var(--border);margin-bottom:12px;padding:16px}
.order-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.order-card-name{font-size:14px;font-weight:500;letter-spacing:.02em;flex:1}
.order-card-time{font-size:10px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.order-status-badge{font-size:9px;font-weight:600;padding:3px 8px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.status-pending{background:#fff8e8;color:#a56c00;border:1px solid #f0d48e}
.status-paid{background:#f0faf4;color:#1a6e3c;border:1px solid #a8d9b9}
.order-card-items{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.8}
.order-card-total{font-size:12px;font-weight:500;font-family:"Cormorant Garamond",serif;color:var(--red)}
.order-card-footer{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.order-mark-paid-btn{padding:6px 14px;border:1px solid #1a6e3c;background:#fff;color:#1a6e3c;
  font-size:9px;cursor:pointer;font-family:"DM Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;transition:.15s;touch-action:manipulation}
.order-mark-paid-btn:hover{background:#1a6e3c;color:#fff}
.order-del-btn{padding:6px 14px;border:1px solid var(--border);background:#fff;color:var(--muted);
  font-size:9px;cursor:pointer;font-family:"DM Sans",sans-serif;letter-spacing:.1em;text-transform:uppercase;transition:.15s;touch-action:manipulation}
.order-del-btn:hover{border-color:var(--red);color:var(--red)}
.orders-empty{text-align:center;color:var(--muted);padding:60px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:600px){
  .orders-header,.orders-toolbar,.orders-body{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>

<div class="event-banner">27SS JOCALIS EXHIBITION &nbsp;—&nbsp; PERSONAL ORDER</div>
<header class="app-header">
  <div style="flex:1">
    <div class="logo">ars JOCALIS</div>
    <div class="logo-sub">WYIN DESIGN INC.</div>
  </div>
  <button class="cart-btn" onclick="openCart()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
    Cart
    <span class="cart-count" id="cart-count" style="display:none">0</span>
  </button>
</header>

<div class="section">
  <div class="section-title serif">お客様情報</div>
  <div class="card">
    <div class="form-grid">
      <div class="form-row">
        <label class="form-label">お名前 *</label>
        <input type="text" id="f-name" class="form-input" placeholder="山田 花子">
      </div>
      <div class="form-row">
        <label class="form-label">メールアドレス</label>
        <input type="email" id="f-email" class="form-input" placeholder="hanako@example.com">
      </div>
      <div class="form-row">
        <label class="form-label">電話番号</label>
        <input type="tel" id="f-tel" class="form-input" placeholder="090-0000-0000">
      </div>
      <div class="form-row delivery-note">
        <label class="form-label">希望納期について</label>
        <div class="delivery-note-main">ご注文より 1.5〜2ヶ月後のお届け</div>
        <div class="delivery-note-sub">※ 商品によって前後する場合がございます</div>
      </div>
      <div class="form-row form-full">
        <label class="form-label">ご住所（配送の場合）</label>
        <input type="text" id="f-address" class="form-input" placeholder="東京都渋谷区...">
      </div>
      <div class="form-row form-full">
        <label class="form-label">備考</label>
        <textarea id="f-note" class="form-textarea" placeholder="特記事項など"></textarea>
      </div>
    </div>
  </div>
</div>

<div class="section products-section">
  <div class="section-title serif">商品を選ぶ</div>
  <div class="filter-bar">
    <span class="filter-label">ブランド</span>
    <button class="filter-btn active" onclick="setBrand('all',this)">すべて</button>
    <button class="filter-btn" onclick="setBrand('JOCALIS',this)">JOCALIS</button>
    <button class="filter-btn" onclick="setBrand('ars',this)">ars</button>
    <div class="filter-sep" style="display:block"></div>
    <span class="filter-label">シーズン</span>
    <button class="filter-btn active" onclick="setSeason('all',this)">すべて</button>
    <button class="filter-btn" onclick="setSeason('27SS',this)">27SS</button>
    <button class="filter-btn" onclick="setSeason('26SS',this)">26SS</button>
    <button class="filter-btn" onclick="setSeason('25AW',this)">25AW</button>
  </div>
  <div class="product-grid" id="product-grid"></div>
</div>

<!-- Cart Drawer -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <div class="cart-title">オーダー内容</div>
    <button class="cart-close" onclick="closeCart()">×</button>
  </div>
  <div class="cart-body" id="cart-body">
    <div class="cart-empty">まだ商品が選ばれていません</div>
  </div>
  <div class="cart-footer">
    <div style="font-size:9px;color:var(--muted);margin-bottom:8px;letter-spacing:.14em;text-transform:uppercase">お受け取り方法</div>
    <div class="ship-toggle">
      <button class="ship-opt active-pickup" id="ship-pickup" onclick="setShipping('pickup')">
        店頭お持ち帰り
      </button>
      <button class="ship-opt" id="ship-delivery" onclick="setShipping('delivery')">
        決済後配送<br><span style="font-size:10px">送料 +¥650</span>
      </button>
      <button class="ship-opt" id="ship-cod" onclick="setShipping('cod')">
        代引き配送<br><span style="font-size:10px">+¥1,310</span>
      </button>
    </div>
    <div class="total-rows" id="cart-totals"></div>

// Filter state
var brandFilter = 'all';
var seasonFilter = 'all';

// Cart
var cart = []; // [{product, size, price, qty}]
var cartId = 0;
var shipping = 'pickup';

function yen(v){ return '¥' + Math.round(v).toLocaleString(); }

function seasonTag(s) {
  var cl = s==='27SS'?'t27':s==='26SS'?'t26':'t25';
  return '<span class="tag '+cl+'">'+s+'</span>';
}

function getPrice(p, size) {
  if (p.prices && p.prices[size]) return p.prices[size];
  if (p.price) return p.price;
  return 0;
}

// ===== FILTERS =====
function setBrand(val, btn) {
  brandFilter = val;
  document.querySelectorAll('.filter-bar .filter-btn').forEach(function(b) {
    var t = b.textContent; if (t==='すべて'||t==='JOCALIS'||t==='ars'||t==='all') {
      // only reset brand buttons - detect by position
    }
  });
  // reset brand buttons
  var allBtns = document.querySelectorAll('.filter-bar .filter-btn');
  var brandBtns = [allBtns[0], allBtns[1], allBtns[2]];
  brandBtns.forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderGrid();
}

function setSeason(val, btn) {
  seasonFilter = val;
  var allBtns = document.querySelectorAll('.filter-bar .filter-btn');
  var seasonBtns = [allBtns[3], allBtns[4], allBtns[5], allBtns[6]];
  seasonBtns.forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderGrid();
}

// ===== PRODUCT GRID =====
var selectedSizes = {}; // id -> size

function renderGrid() {
  var products = PRODUCTS.filter(function(p) {
    if (brandFilter !== 'all' && p.brand !== brandFilter) return false;
    if (seasonFilter !== 'all' && p.season !== seasonFilter) return false;
    return true;
  });

  var grid = document.getElementById('product-grid');
  if (products.length === 0) {
    grid.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:20px 0">該当商品がありません</div>';
    return;
  }

  grid.innerHTML = products.map(function(p) {
    var priceKeys0 = p.prices ? Object.keys(p.prices) : [];
    var basePrice = p.price || (priceKeys0.length ? p.prices[priceKeys0[0]] : 0);
    var discPrice = Math.round(basePrice * 0.7);
    var hasSizes = p.sizes && p.sizes.length > 0 && !(p.sizes.length === 1 && p.sizes[0] === 'F');
    var isFree = p.sizes && p.sizes.length === 1 && p.sizes[0] === 'F';
    var sel = selectedSizes[p.id] || '';

    var sizeHtml = '';
    if (hasSizes) {
      sizeHtml = '<div class="size-row">' +
        p.sizes.map(function(sz) {
          var szPrice = getPrice(p, sz);
          var label = p.prices ? sz + ' ¥' + Math.round(szPrice*0.7).toLocaleString() : sz;
          return '<button class="size-btn' + (sel===sz?' selected':'') + '" onclick="selectSize(\'' + p.id + '\',\'' + sz + '\',this)">' + label + '</button>';
        }).join('') +
      '</div>';
    }

    var priceVals = p.prices ? Object.keys(p.prices).map(function(k){return p.prices[k];}) : null;
    var priceMin = priceVals ? Math.min.apply(null,priceVals) : 0;
    var priceMax = priceVals ? Math.max.apply(null,priceVals) : 0;
    var priceNote = p.prices ?
      '<span class="price-retail">上代 ' + yen(priceMin) + (priceMin!==priceMax ? '〜' + yen(priceMax) : '') + '</span>' :
      '<span class="price-retail">上代 ' + yen(basePrice) + '</span>';
    if (isFree && !p.prices) priceNote = '<span class="price-retail">上代 ' + yen(basePrice) + '</span>';

    var addLabel = isFree ? '追加する' : (sel ? '追加する' : 'サイズを選択');
    var disabled = (!isFree && !sel) ? 'disabled' : '';

    var letter = (p.name || '').charAt(0) || '✦';
    var typeLabel = (p.type || '');
    var imgHtml = '<div class="prod-img">' +
      (p.image
        ? '<img src="/.netlify/functions/img?url=' + encodeURIComponent(p.image) + '" alt="' + p.name + '" loading="lazy" decoding="async" onerror="this.parentNode.innerHTML=\'<div class=\\\"prod-img-ph\\\"><span class=\\\"prod-img-ph-letter\\\">' + letter + '</span><span class=\\\"prod-img-ph-type\\\">' + typeLabel + '</span></div>\'">'
        : '<div class="prod-img-ph"><span class="prod-img-ph-letter">' + letter + '</span><span class="prod-img-ph-type">' + typeLabel + '</span></div>'
      ) + '</div>';

    return '<div class="product-card" id="pc-' + p.id + '">' +
      imgHtml +
      '<div class="prod-name">' + p.name + '</div>' +
      '<div class="prod-meta">' +
        seasonTag(p.season) +
        '<span>' + p.brand + '</span>' +

function selectSize(productId, size, btn) {
  selectedSizes[productId] = size;
  // update buttons in this card
  var card = document.getElementById('pc-' + productId);
  card.querySelectorAll('.size-btn').forEach(function(b){ b.classList.remove('selected'); });
  btn.classList.add('selected');
  // enable add button
  var addBtn = document.getElementById('add-' + productId);
  if (addBtn) { addBtn.disabled = false; addBtn.textContent = '追加する'; }
}

// ===== CART =====
function addToCart(productId) {
  var p = PRODUCTS.find(function(x){ return x.id === productId; });
  if (!p) return;
  var isFree = p.sizes && p.sizes.length === 1 && p.sizes[0] === 'F';
  var size = isFree ? 'F' : (selectedSizes[productId] || '');
  if (!isFree && !size) { showToast('サイズを選択してください'); return; }

  var price = getPrice(p, size);
  var discPrice = Math.round(price * 0.7);

  // check if same product+size already in cart
  var existing = cart.find(function(item){ return item.productId === productId && item.size === size; });
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ id: cartId++, productId: productId, name: p.name, brand: p.brand, season: p.season,
      collection: p.collection || '', type: p.type || '', size: size, price: price, discPrice: discPrice, qty: 1 });
  }
  updateCartCount();
  showToast((isFree ? '' : size + '  ') + 'カートに追加しました');
  if (!isFree) { selectedSizes[productId] = ''; renderGrid(); }
}

function removeFromCart(cartItemId) {
  cart = cart.filter(function(item){ return item.id !== cartItemId; });
  updateCartCount();
  renderCart();
}

function changeQty(cartItemId, delta) {
  var item = cart.find(function(i){ return i.id === cartItemId; });
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderCart();
  updateCartCount();
}

function updateCartCount() {
  var total = cart.reduce(function(s,i){ return s + i.qty; }, 0);
  var el = document.getElementById('cart-count');
  if (total > 0) { el.style.display = 'flex'; el.textContent = total; }
  else { el.style.display = 'none'; }
}

function openCart() {
  document.getElementById('cart-overlay').classList.add('open');
  document.getElementById('cart-drawer').classList.add('open');
  renderCart();
}

function closeCart() {
  document.getElementById('cart-overlay').classList.remove('open');
  document.getElementById('cart-drawer').classList.remove('open');
}

function renderCart() {
  var body = document.getElementById('cart-body');
  if (cart.length === 0) {
    body.innerHTML = '<div class="cart-empty">まだ商品が選ばれていません</div>';
    document.getElementById('cart-totals').innerHTML = '';
    document.getElementById('print-btn').disabled = true;
    if (adminUnlocked) { var cb=document.getElementById('checkout-btn'); if(cb) cb.disabled=true; }
    return;
  }

  body.innerHTML = cart.map(function(item) {
    var sub = Math.round(item.discPrice * item.qty);
    return '<div class="cart-line">' +
      '<div>' +
        '<div class="cl-name">' + item.name + '</div>' +
        '<div class="cl-meta">' + item.brand + ' / ' + (item.size !== 'F' ? item.size + ' / ' : '') + item.type + '</div>' +
        '<div class="qty-ctrl" style="margin-top:4px">' +
          '<button class="qty-btn" onclick="changeQty(' + item.id + ',-1)">−</button>' +
          '<span class="qty-num">' + item.qty + '</span>' +
          '<button class="qty-btn" onclick="changeQty(' + item.id + ',1)">＋</button>' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="cl-price">' + yen(item.discPrice) + '</div>' +
        (item.qty > 1 ? '<div class="cl-sub">小計 ' + yen(sub) + '</div>' : '') +
        '<div class="cl-sub" style="color:var(--muted)">上代 ' + yen(item.price) + '</div>' +
      '</div>' +
      '<button class="cl-del" onclick="removeFromCart(' + item.id + ')">×</button>' +
    '</div>';

  renderTotals();
  document.getElementById('print-btn').disabled = false;
  if (adminUnlocked) updateAdminBtn();

function renderTotals() {
  var retailTotal = cart.reduce(function(s,i){ return s + i.price * i.qty; }, 0);
  var disc = Math.round(retailTotal * 0.3);
  var pay = retailTotal - disc;

// ===== ORDER STORAGE =====
var ORDER_KEY = 'arsjocalis_orders';

function loadOrders() {
  try { return JSON.parse(localStorage.getItem(ORDER_KEY) || '[]'); }
  catch(e) { return []; }
}

function saveOrder(order) {
  try {
    var orders = loadOrders();
    orders.unshift(order);
    localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
  } catch(e) { console.error('Order save failed', e); }
}

function updateOrderStatus(id, status) {
  try {
    var orders = loadOrders();
    var o = orders.find(function(x){ return x.id === id; });
    if (o) { o.status = status; o.paidAt = new Date().toISOString(); }
    localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
  } catch(e) {}
}

function deleteOrder(id) {
  try {
    var orders = loadOrders().filter(function(o){ return o.id !== id; });
    localStorage.setItem(ORDER_KEY, JSON.stringify(orders));
  } catch(e) {}
}

        '</div>' +
        statusBadge +
        '<div class="order-card-time">' + dtStr + '</div>' +
      '</div>' +
      '<div class="order-card-items">' + itemSummary + '</div>' +
      '<div class="order-card-total">' + yen(o.total) + '<span style="font-size:10px;color:var(--muted);font-family:\'DM Sans\',sans-serif"> （税込・全費用込み）</span></div>' +
      footer +
    '</div>';
  }).join('');
}

function markPaidFromPanel(id) {
  updateOrderStatus(id, 'paid');
  renderOrdersPanel(loadOrders());
  showToast('入金済みに更新しました');
}

function deleteOrderFromPanel(id) {
  if (!confirm('この受注データを削除しますか？')) return;
  deleteOrder(id);
  renderOrdersPanel(loadOrders());
  showToast('削除しました');
}

function clearAllOrders() {
  if (!confirm('全件の受注データを削除しますか？この操作は取り消せません。')) return;
  try { localStorage.removeItem(ORDER_KEY); } catch(e) {}
  renderOrdersPanel([]);
  showToast('全件削除しました');
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function exportOrdersCSV() {
  var orders = loadOrders();
  if (orders.length === 0) { showToast('受注データがありません'); return; }
  var header = ['受注日時','お名前','電話番号','メール','お受け取り方法','住所','商品（品名/サイズ/数量/価格）','上代合計','卸値計','消費税','送料','代引手数料','合計（税込）','支払ステータス'];
  var rows = orders.map(function(o) {
    var itemsStr = o.items.map(function(i){
      return i.name + (i.size&&i.size!=='F'?'/'+i.size:'') + '/' + i.qty + '個/' + i.price + '円';
    }).join(' | ');
    var status = o.status === 'paid' ? '入金済み' : '未入金';
    return [
      o.createdAt.replace('T',' ').replace('Z','').substring(0,16),
      o.name, o.tel||'', o.email||'', o.shipping, o.address||'',
      itemsStr,
      o.retailTotal||'', o.subtotal||'', o.tax||'', o.shipFee||0, o.codFee||0, o.total,
      status
    ].map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(',');
  });
  var csv = '﻿' + [header.join(',')].concat(rows).join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var d = new Date();
  a.download = 'jocalis_orders_' + d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
}

// ===== TOAST =====
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

// ===== INIT =====
try {
  renderGrid();
} catch(e) {
  var grid = document.getElementById('product-grid');
  if (grid) grid.innerHTML = '<div style="color:#b5281e;padding:20px;font-size:12px;">エラー: ' + e.message + '</div>';
}
</script>
